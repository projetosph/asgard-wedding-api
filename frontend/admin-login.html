<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#214c3a">
  <title>ADM · Noivaria</title>
  <link rel="icon" type="image/svg+xml" href="assets/branding/noivaria-logo.svg">
  <style>
    *{box-sizing:border-box}
    :root{--forest:#214c3a;--forest2:#365f4d;--sage:#76937f;--ink:#18251f;--muted:#68756e;--line:rgba(33,76,58,.14)}
    body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:
      radial-gradient(circle at 15% 15%,rgba(118,147,127,.24),transparent 26%),
      radial-gradient(circle at 85% 80%,rgba(33,76,58,.17),transparent 28%),
      linear-gradient(135deg,#f6f7f3 0%,#edf2ee 45%,#e7eee9 100%);overflow:hidden}
    body::before,body::after{content:"";position:fixed;pointer-events:none;border-radius:999px 999px 0 0;filter:blur(1px);opacity:.14}
    body::before{width:420px;height:620px;left:-105px;bottom:-180px;background:linear-gradient(180deg,#173e30,#2f644d)}
    body::after{width:320px;height:500px;right:-65px;top:80px;background:linear-gradient(180deg,#71957d,#5c806a)}
    .shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;position:relative;z-index:1}
    .brand-panel{padding:58px max(42px,calc((100vw - 1180px)/2));display:flex;flex-direction:column}
    .brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:inherit;width:max-content}.brand img{width:52px;height:52px}.brand-copy{display:grid}.brand-copy strong{font-size:15px;letter-spacing:1.7px}.brand-copy small{margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:1.2px;text-transform:uppercase}
    .brand-message{margin:auto 0;max-width:600px}.brand-message span{font-size:10px;font-weight:900;letter-spacing:2.4px;color:var(--sage)}.brand-message h1{margin:15px 0 16px;font:400 clamp(48px,5.4vw,76px)/.98 Georgia,serif;letter-spacing:-2px}.brand-message h1 em{display:block;color:var(--forest2);font-style:normal}.brand-message p{max-width:520px;color:var(--muted);font-size:16px;line-height:1.7}
    .login-panel{display:grid;place-items:center;padding:35px}.card{width:min(440px,100%);padding:34px;border-radius:26px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 90px rgba(31,64,50,.14)}.login-logo{width:60px;height:60px;margin-bottom:12px}.card .eyebrow{display:block;color:var(--sage);font-size:9px;font-weight:900;letter-spacing:2px}.card h2{margin:8px 0 7px;font:400 39px Georgia,serif}.card .lead{margin:0 0 24px;color:var(--muted);font-size:13px}.card label{display:block;margin:12px 0;font-size:11px;font-weight:800}.card input{display:block;width:100%;height:48px;margin-top:6px;border:1px solid var(--line);border-radius:11px;padding:0 13px;background:rgba(255,255,255,.9);outline:none}.card input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(118,147,127,.12)}.card button{width:100%;height:48px;margin-top:12px;border:0;border-radius:11px;background:var(--forest);color:#fff;font-weight:900;letter-spacing:.5px;cursor:pointer;box-shadow:0 12px 25px rgba(33,76,58,.17)}#msg{min-height:18px;color:#a13c3c;font-size:12px}.back{display:block;margin-top:18px;text-align:center;color:var(--muted);font-size:11px;text-decoration:none}
    @media(max-width:820px){body{overflow:auto}.shell{grid-template-columns:1fr}.brand-panel{min-height:38vh;padding:28px 24px}.brand-message{margin-top:60px}.brand-message h1{font-size:48px}.login-panel{padding:20px 20px 50px}.card{padding:28px}}
  </style>
</head>
<body>
<main class="shell">
  <section class="brand-panel">
    <a class="brand" href="index.html">
      <img src="assets/branding/noivaria-logo.svg" alt="Noivaria">
      <span class="brand-copy"><strong>NOIVARIA</strong><small>por Azgard</small></span>
    </a>
    <div class="brand-message">
      <span>ADMINISTRAÇÃO</span>
      <h1>Controle a plataforma, <em>sem complicação.</em></h1>
      <p>Gerencie casais, sites, status, acessos e integrações em uma única área administrativa.</p>
    </div>
  </section>
  <section class="login-panel">
    <form class="card" id="formLogin">
      <img class="login-logo" src="assets/branding/noivaria-logo.svg" alt="">
      <span class="eyebrow">ACESSO RESTRITO</span>
      <h2>Administrador</h2>
      <p class="lead">Entre com suas credenciais da Azgard para continuar.</p>
      <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
      <label>Senha<input id="senha" type="password" autocomplete="current-password" required></label>
      <button>ENTRAR NO ADM</button>
      <p id="msg"></p>
      <a class="back" href="index.html">← Voltar para a Noivaria</a>
    </form>
  </section>
</main>
<script>
const API="https://asgard-wedding-api.onrender.com";
document.getElementById("formLogin").onsubmit=async e=>{
  e.preventDefault();
  const msg=document.getElementById("msg"); msg.textContent="Entrando...";
  try{
    const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),senha:senha.value})});
    const d=await r.json();
    if(!r.ok) throw Error(d.erro||"Não foi possível entrar.");
    if(d.usuario?.perfil!=="admin") throw Error("Este acesso não é de administrador.");
    sessionStorage.setItem("asgard_admin_token",d.token);
    sessionStorage.setItem("asgard_admin_usuario",JSON.stringify(d.usuario));
    location.href="admin.html";
  }catch(err){msg.textContent=err.message}
};
</script>
</body>
</html>
