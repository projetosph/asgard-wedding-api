<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADM · Asgard Wedding</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17352d;font-family:Inter,Arial,sans-serif;color:#17211d}.card{width:min(420px,calc(100% - 30px));padding:32px;border-radius:18px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.2)}h1{font:400 34px Georgia,serif;margin:5px 0 22px}small{letter-spacing:2px;color:#60756d}label{display:block;margin:12px 0;font-size:11px;font-weight:800}input{display:block;width:100%;height:46px;margin-top:6px;border:1px solid #dce2de;border-radius:9px;padding:0 12px}button{width:100%;height:46px;margin-top:12px;border:0;border-radius:9px;background:#25483e;color:#fff;font-weight:800;cursor:pointer}#msg{min-height:18px;color:#a13c3c}
  </style>
</head>
<body>
<form class="card" id="formLogin">
  <small>ASGARD WEDDING</small>
  <h1>Administrador</h1>
  <label>E-mail<input id="email" type="email" required></label>
  <label>Senha<input id="senha" type="password" required></label>
  <button>Entrar</button>
  <p id="msg"></p>
</form>
<script>
const API="https://asgard-wedding-api.onrender.com";
document.getElementById("formLogin").onsubmit=async e=>{
  e.preventDefault();
  const msg=document.getElementById("msg"); msg.textContent="Entrando...";
  try{
    const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),senha:senha.value})});
    const d=await r.json();
    if(!r.ok) throw Error(d.erro||"Não foi possível entrar.");
    if(d.usuario?.perfil!=="admin") throw Error("Este acesso não é de administrador.");
    sessionStorage.setItem("asgard_admin_token",d.token);
    sessionStorage.setItem("asgard_admin_usuario",JSON.stringify(d.usuario));
    location.href="admin.html";
  }catch(err){msg.textContent=err.message}
};
</script>
</body>
</html>
