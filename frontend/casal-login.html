<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Casal | Asgard Wedding</title>
  <link rel="stylesheet" href="casal.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <a href="index.html" class="brand">
        <span class="brand-mark">AW</span>
        <span><strong>ASGARD WEDDING</strong><small>por Asgard Tech</small></span>
      </a>
      <div class="auth-copy">
        <span class="eyebrow">ÁREA EXCLUSIVA</span>
        <h1>Seu casamento,<br><em>sob seu controle.</em></h1>
        <p>Acompanhe presentes, pagamentos, confirmações e recados em um só lugar.</p>
      </div>
    </section>
    <section class="login-panel">
      <div class="login-box">
        <span class="eyebrow">PAINEL DO CASAL</span>
        <h2>Bem-vindos de volta</h2>
        <p class="muted">Entre com o acesso fornecido pela Asgard Wedding.</p>
        <form id="loginForm">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required>
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required minlength="8">
          <button class="primary-btn" type="submit">ENTRAR NO PAINEL</button>
          <p id="loginErro" class="error-text"></p>
        </form>
        <a class="back-link" href="index.html">← Voltar para a Asgard Wedding</a>
      </div>
    </section>
  </main>
  <script src="casal-login.js"></script>
</body>
</html>
