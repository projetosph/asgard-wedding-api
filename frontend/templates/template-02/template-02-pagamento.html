<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento</title>
  <link rel="stylesheet" href="template-02.css">
</head>
<body>
<div class="t2-shell">
  <div id="t2Header"></div>

  <main class="t2-main" style="display:grid;place-items:center;padding:50px 0">
    <section class="t2-paper t2-music-card">
      <div class="t2-music-art">♡</div>
      <span class="t2-eyebrow">Seu presente</span>
      <h2 id="tituloPagamento">Acompanhando o pagamento</h2>
      <p id="resumoPagamento" style="color:var(--t2-muted)">As informações do pagamento aparecerão aqui.</p>
      <div id="areaPagamento"></div>
      <a id="voltarLista" class="t2-btn t2-btn-primary" href="#">Voltar à lista de presentes</a>
    </section>
  </main>

  <div id="t2Footer"></div>
</div>

<script src="template-02-common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  await t2InicializarPagina("");
  document.getElementById("voltarLista").href = t2Link("template-02-presentes.html");

  const compra = JSON.parse(localStorage.getItem("compraAtual") || "null");
  if (compra) {
    const valor = Number(compra.valor || 0).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });
    document.getElementById("resumoPagamento").textContent =
      `${compra.produtoNome || "Presente"} · ${valor}`;
  }
});
</script>
</body>
</html>
