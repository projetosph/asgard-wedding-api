<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local</title>
  <link rel="stylesheet" href="template-02.css">
</head>
<body>
<div class="t2-shell">
  <div id="t2Header"></div>

  <main class="t2-main">
    <div class="t2-page-heading">
      <span class="t2-eyebrow">Cerimônia & festa</span>
      <h1>Onde será</h1>
      <div class="t2-leaf-divider"><span>❧</span></div>
      <p>Confira o local do nosso grande dia e abra a rota para chegar com tranquilidade.</p>
    </div>

    <section class="t2-paper t2-local-card" style="margin-bottom:36px">
      <div class="t2-detail-list" style="margin-top:0;margin-bottom:18px">
        <div class="t2-detail-row">
          <div class="t2-detail-icon" id="localIcone"></div>
          <div>
            <span>Local</span>
            <strong id="localNome">—</strong>
            <small id="localEndereco" style="display:block;margin-top:5px;color:var(--t2-muted)">—</small>
          </div>
        </div>
      </div>

      <iframe
        id="mapaFrame"
        class="t2-map"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Mapa do casamento"></iframe>

      <a id="mapaLink" class="t2-btn t2-btn-primary" style="margin-top:16px" target="_blank" rel="noopener noreferrer">
        Abrir no mapa ↗
      </a>
    </section>
  </main>

  <div id="t2Footer"></div>
</div>

<script src="template-02-common.js"></script>
<script src="template-02-local.js"></script>
</body>
</html>
