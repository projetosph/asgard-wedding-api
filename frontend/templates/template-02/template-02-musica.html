<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa Música</title>
  <link rel="stylesheet" href="template-02.css">
</head>
<body>
<div class="t2-shell">
  <div id="t2Header"></div>

  <main class="t2-main">
    <div class="t2-page-heading">
      <span class="t2-eyebrow">Nossa trilha sonora</span>
      <h1>Músicas</h1>
      <div class="t2-leaf-divider"><span>❧</span></div>
      <p>Algumas histórias também ficam guardadas em uma melodia.</p>
    </div>

    <section class="t2-paper t2-music-card">
      <div class="t2-music-art" id="musicIcon"></div>
      <span class="t2-eyebrow">Nossa música</span>
      <h2 id="musicaTitulo">—</h2>
      <div id="musicaPlayer">
        <p style="color:var(--t2-muted)">Carregando...</p>
      </div>
    </section>
  </main>

  <div id="t2Footer"></div>
</div>

<script src="template-02-common.js"></script>
<script src="template-02-musica.js"></script>
</body>
</html>
