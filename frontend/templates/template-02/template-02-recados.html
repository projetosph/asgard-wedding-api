<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recados</title>
  <link rel="stylesheet" href="template-02.css">
</head>
<body>
<div class="t2-shell">
  <div id="t2Header"></div>

  <main class="t2-main">
    <div class="t2-page-heading">
      <span class="t2-eyebrow">Com carinho</span>
      <h1>Recados</h1>
      <div class="t2-leaf-divider"><span>❧</span></div>
      <p>Deixe algumas palavras para nós. Vamos guardar cada mensagem como uma lembrança desse momento.</p>
    </div>

    <section class="t2-recados-layout">
      <article class="t2-paper t2-recado-form">
        <h2>Deixe seu carinho</h2>
        <form id="formRecado" class="t2-form-grid">
          <div class="t2-field">
            <label for="nomeRecado">Seu nome</label>
            <input id="nomeRecado" required placeholder="Nome e sobrenome">
          </div>
          <div class="t2-field">
            <label for="mensagemRecado">Sua mensagem</label>
            <textarea id="mensagemRecado" required placeholder="Escreva uma mensagem para os noivos..."></textarea>
          </div>
          <button class="t2-btn t2-btn-primary" type="submit">Enviar recado</button>
          <p id="statusRecado" class="t2-status"></p>
        </form>
      </article>

      <section class="t2-messages" id="listaRecados">
        <div class="t2-paper t2-empty">Carregando recados...</div>
      </section>
    </section>
  </main>

  <div id="t2Footer"></div>
</div>

<script src="template-02-common.js"></script>
<script src="template-02-recados.js"></script>
</body>
</html>
