<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asgard Wedding</title>

  <!-- Reutiliza o MESMO style.css do Template Paulo & Alana -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="logo" data-casal-iniciais>P & A</div>

  <div style="display:flex; gap:10px;">
    <a href="presentes.html" data-preservar-casamento class="btnHeader">Lista de Presentes</a>
    <a href="login.html" class="btnHeader adminBtn">Admin</a>
  </div>
</header>

<section class="hero">
  <h1 data-casal-nomes>Paulo & Alana</h1>
  <img src="../../assets/bg/separador.png" class="separador" alt="">
  <p class="subHero" data-casamento-data>07/09/2026</p>
  <p id="contador" class="contadorPremium"></p>
  <p data-erro-casamento></p>
</section>

<section class="grid">
  <div class="box">
    <h3>LISTA DE PRESENTES</h3>
    <a href="presentes.html" data-preservar-casamento class="btn">ACESSAR</a>
  </div>

  <div class="box">
    <h3>LISTA DE PRESENÇA</h3>
    <a href="presenca.html" data-preservar-casamento class="btn">CONFIRMAR</a>
  </div>

  <div class="box">
    <h3>LOCAL</h3>
    <p data-local-nome></p>
  </div>
</section>

<footer class="footer">
  <h3 class="logoFooter">ASGARD TECH</h3>
  <p class="frase">Feito com ❤ para todos os casais</p>
  <small>© 2026 Asgard TECH</small>
</footer>

<script src="../../casamento-context.js"></script>
<script>
document.addEventListener("asgard:casamento-carregado", (event) => {
  const casamento = event.detail;
  const destino = dataHoraCasamento(casamento);
  const contador = document.getElementById("contador");
  if (!destino || !contador) return;

  function atualizar() {
    const diferenca = destino.getTime() - Date.now();

    if (diferenca <= 0) {
      contador.textContent = "O GRANDE DIA CHEGOU";
      return;
    }

    const dias = Math.floor(diferenca / 86400000);
    const horas = Math.floor((diferenca % 86400000) / 3600000);
    const minutos = Math.floor((diferenca % 3600000) / 60000);

    contador.textContent = `${dias} DIAS | ${horas} HORAS | ${minutos} MIN`;
  }

  atualizar();
  setInterval(atualizar, 60000);
});
</script>
</body>
</html>
