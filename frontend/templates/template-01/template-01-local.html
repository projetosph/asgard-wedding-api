<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local</title>
  <link rel="stylesheet" href="template-01.css">
</head>

<body>
<div class="t1-shell">
  <div id="t1Header"></div>

  <section class="t1-page-hero">
    <div>
      <span style="text-transform:uppercase">Cerimônia & festa</span>
      <h1>Local</h1>
      <p>Confira onde será o nosso grande dia.</p>
    </div>
  </section>

  <main class="t1-page-main">
    <section class="t1-location-panel">
      <h2 id="localName">—</h2>
      <p id="localAddress">—</p>

      <iframe
        id="localMap"
        class="t1-map"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>

      <a
        id="localMapLink"
        class="t1-btn"
        style="margin-top:14px"
        target="_blank"
        rel="noopener noreferrer"
      >
        Abrir no Maps
      </a>
    </section>
  </main>

  <div id="t1Footer"></div>
</div>

<script src="template-01-common.js"></script>
<script src="template-01-local.js"></script>
</body>
</html>
