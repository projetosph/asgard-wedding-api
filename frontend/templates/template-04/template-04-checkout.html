<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentear</title><link rel="stylesheet" href="template-04.css"></head><body data-page=""><div class="shell"><div id="hdr"></div><section class="pageHero"><div><span class="kicker">Seu presente</span><h1>Presentear</h1><p>Escolha quanto deseja contribuir e a forma de pagamento.</p></div></section><main class="content"><section class="checkoutGrid"><aside class="card checkoutCard checkoutProduct"><img id="fotoProduto"><span class="kicker" style="display:block;margin-top:16px">Você está presenteando</span><h2 id="nomeProdutoCheckout">—</h2><p id="valorOriginal"></p><strong id="valorRestante">—</strong></aside><section class="card checkoutCard"><label>Seu nome<input id="nome"></label><label>Seu e-mail<input id="email" type="email"></label><div class="checkoutBox"><div class="checkoutTitle" onclick="abrirOpcao('parcial')"><strong>PARTE DO VALOR</strong><small>Contribua com qualquer quantia.</small></div><div id="parcial" class="checkoutContent"><input id="valorContribuicao" type="number" min="1" step="0.01"><div class="opcao" onclick="selecionar(this,'pix')"><span>PIX</span><span>◆</span></div><div class="opcao" onclick="selecionar(this,'cartao')"><span>Cartão</span><span>▭</span></div><button class="btnFinalizar" onclick="continuarPagamento('parcial')">CONTINUAR</button></div></div><div class="checkoutBox"><div class="checkoutTitle" onclick="abrirOpcao('total')"><strong>VALOR COMPLETO</strong><small>Presenteie todo o valor restante.</small></div><div id="total" class="checkoutContent"><p>Valor restante: <strong id="valorCompletoTexto">—</strong></p><div class="opcao" onclick="selecionar(this,'pix')"><span>PIX</span><span>◆</span></div><div class="opcao" onclick="selecionar(this,'cartao')"><span>Cartão</span><span>▭</span></div><button class="btnFinalizar" onclick="continuarPagamento('total')">CONTINUAR</button></div></div><div id="areaPagamento"></div></section></section></main><div id="ftr"></div></div><script src="template-04-common.js"></script><script src="template-04-app.js"></script><script src="https://sdk.mercadopago.com/js/v2"></script><script src="../../utils.js"></script><script src="../../casamento-context.js"></script><script src="../../checkout.js"></script></body></html>
