<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prévia do Template</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f4f2ed;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: #536057;
    }

    .loading strong {
      display: block;
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
    }

    .loading small {
      color: #7b827e;
    }
  </style>
</head>

<body>

  <div class="loading">
    <div>
      <strong>Carregando prévia real...</strong>
      <small>Asgard Wedding</small>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const templateRecebido =
      String(params.get("template") || "template-01")
        .trim()
        .toLowerCase();

    /*
      Use um casamento de demonstração que esteja PUBLICADO.
      Hoje estamos usando João & Maria.
    */
    const SLUG_PREVIEW = "joao-e-maria";

    function normalizarTemplate(valor) {
      if (["template-04", "template04", "04", "4"].includes(valor)) {
        return "template-04";
      }

      if (["template-03", "template03", "03", "3"].includes(valor)) {
        return "template-03";
      }

      if (["template-02", "template02", "02", "2"].includes(valor)) {
        return "template-02";
      }

      return "template-01";
    }

    const template = normalizarTemplate(templateRecebido);

    const destino =
      `templates/${template}/${template}.html` +
      `?casamento=${encodeURIComponent(SLUG_PREVIEW)}` +
      `&admPreview=1`;

    window.location.replace(destino);
  </script>

</body>
</html>
