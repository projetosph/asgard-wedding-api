<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Asgard Wedding</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ed;color:#26332e;font-family:Inter,Arial,sans-serif}.box{max-width:600px;padding:36px;text-align:center}.box h1{font:400 42px Georgia,serif;margin:8px 0}.box p{color:#6f7772;line-height:1.6}.tag{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.spinner{width:32px;height:32px;margin:18px auto;border:3px solid #ddd;border-top-color:#35584d;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="box" id="estado">
  <span class="tag">Asgard Wedding</span>
  <h1>Carregando...</h1>
  <div class="spinner"></div>
</div>

<script>
const API="https://asgard-wedding-api.onrender.com";
const slug=new URLSearchParams(location.search).get("casamento")||"";

function normalizarTemplate(valor){
  const t=String(valor||"template-01").trim().toLowerCase();
  if(["template-04","template04","04","4"].includes(t)) return "template-04";
  if(["template-03","template03","03","3"].includes(t)) return "template-03";
  if(["template-02","template02","02","2"].includes(t)) return "template-02";
  return "template-01";
}

function mensagemForaDoAr(c){
  const nomes=c?.noivo&&c?.noiva?`${c.noivo} & ${c.noiva}`:"Este casamento";
  const textos={
    pausado:"Este site está temporariamente pausado.",
    concluido:"Este site foi encerrado após a celebração.",
    cancelado:"Este site não está mais disponível.",
    arquivado:"Este site está arquivado.",
    rascunho:"Este site ainda não foi publicado."
  };
  document.getElementById("estado").innerHTML=`
    <span class="tag">Asgard Wedding</span>
    <h1>${nomes}</h1>
    <p>${textos[c.status]||"Este site não está disponível no momento."}</p>
  `;
}

(async()=>{
  if(!slug){
    document.getElementById("estado").innerHTML="<h1>Link inválido</h1><p>Não foi informado um casamento.</p>";
    return;
  }

  try{
    const sr=await fetch(`${API}/api/casamentos/${encodeURIComponent(slug)}/status-publico`,{cache:"no-store"});
    const status=await sr.json();

    if(!sr.ok||!status.existe){
      document.getElementById("estado").innerHTML="<h1>Site não encontrado</h1><p>Confira o endereço recebido.</p>";
      return;
    }

    if(status.status!=="publicado"){
      mensagemForaDoAr(status);
      return;
    }

    const template=normalizarTemplate(status.template);
    location.replace(`templates/${template}/${template}.html?casamento=${encodeURIComponent(slug)}`);
  }catch(e){
    document.getElementById("estado").innerHTML="<h1>Não foi possível abrir o site</h1><p>Tente novamente em alguns instantes.</p>";
  }
})();
</script>
</body>
</html>
