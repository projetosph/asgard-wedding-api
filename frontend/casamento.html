<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asgard Wedding</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#f8f7f3;color:#263b34;font-family:Inter,"Segoe UI",Arial,sans-serif}
    .loading{text-align:center;padding:24px}
    .loading strong{display:block;margin-bottom:8px;font-family:Georgia,serif;font-size:28px;font-weight:400}
    .loading p{margin:0;color:#6d7772;font-size:13px}
  </style>
</head>
<body>
  <div class="loading">
    <strong>Asgard Wedding</strong>
    <p id="status">Carregando casamento...</p>
  </div>

  <script>
    const API = "https://asgard-wedding-api.onrender.com";

    function normalizarTemplate(valor) {
  const t = String(valor || "template-01").trim().toLowerCase();

  if (["template-04", "template04", "04", "4"].includes(t)) {
    return "template-04";
  }

  if (["template-03", "template03", "03", "3"].includes(t)) {
    return "template-03";
  }

  if (["template-02", "template02", "02", "2"].includes(t)) {
    return "template-02";
  }

  return "template-01";
  }

    async function iniciar() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("casamento");

      if (!slug) {
        window.location.replace("index.html");
        return;
      }

      try {
        const resposta = await fetch(
          `${API}/api/casamentos/${encodeURIComponent(slug)}`,
          { cache: "no-store" }
        );

        if (!resposta.ok) throw new Error("Casamento não encontrado.");

        const dados = await resposta.json();
        const casamento = dados.casamento || dados;
        const template = normalizarTemplate(casamento.template);

        const destino =
          `templates/${template}/${template}.html?casamento=${encodeURIComponent(slug)}&v=20261004-5`;

        window.location.replace(destino);
      } catch (erro) {
        console.error(erro);
        document.getElementById("status").textContent =
          "Não foi possível carregar este casamento.";
      }
    }

    iniciar();
  </script>
</body>
</html>
